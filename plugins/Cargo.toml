# Persephone plugins, built for wasm32-wasip2:
#
#     cargo build --release --target wasm32-wasip2
#
# Each crate becomes target/wasm32-wasip2/release/<name>.wasm; copy it into Persephone's plugins
# folder (or use `persephone-cli plugin build`). `fixtures` are plugins that misbehave on
# purpose, for the host's sandbox tests.
[workspace]
resolver = "3"
members = ["examples/*", "fixtures/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = true
strip = true
