[package]
name = "persephone"
description = "Persephone: a tiled, chart-only backtesting app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
persephone-chart.workspace = true
persephone-core.workspace = true
persephone-data.workspace = true
persephone-engine = { workspace = true, features = ["live"] }
persephone-ml.workspace = true
persephone-plugin-host.workspace = true
persephone-tiling.workspace = true
anyhow.workspace = true
dirs.workspace = true
iced.workspace = true
notify.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
iced_test = "0.14"
# To run the tasks a live session hands back, in tests.
iced_runtime = "0.14"

[lints.rust]
# With Nautilus's live node linked in, macOS's linker notes that the debug binary's unwind
# tables are too big for its compact format; harmless.
linker_messages = "allow"
