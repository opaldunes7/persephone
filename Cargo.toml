[workspace]
resolver = "3"
members = ["crates/*"]
# Plugins build for wasm32-wasip2 in a workspace of their own.
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Nautilus is pinned to one exact version: its Rust API still changes between
# releases, and every nautilus-* crate must agree on the same version.
nautilus-analysis = "=0.66.0"
nautilus-backtest = "=0.66.0"
# Binance and the sandbox only for live trading; their default features would switch every
# crate to high-precision values.
nautilus-binance = { version = "=0.66.0", default-features = false }
nautilus-common = "=0.66.0"
nautilus-core = "=0.66.0"
nautilus-execution = "=0.66.0"
nautilus-indicators = "=0.66.0"
nautilus-live = "=0.66.0"
nautilus-model = "=0.66.0"
nautilus-sandbox = { version = "=0.66.0", default-features = false }
nautilus-trading = "=0.66.0"

persephone-chart = { path = "crates/chart" }
persephone-core = { path = "crates/core" }
persephone-data = { path = "crates/data" }
persephone-engine = { path = "crates/engine" }
persephone-ml = { path = "crates/ml" }
persephone-plugin-host = { path = "crates/plugin-host" }
persephone-tiling = { path = "crates/tiling" }

anyhow = "1"
async-trait = "0.1"
arrow-array = "60"
arrow-schema = "60"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
flate2 = "1"
iced = { version = "0.14", features = ["advanced", "canvas", "wgpu"] }
jiff = "0.2"
log = "0.4"
notify = "8"
# Tick store files: Parquet with ZSTD, without the parts of Arrow we don't use.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
ron = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Only to run Nautilus's live node, which is async.
tokio = { version = "1", features = ["rt", "time", "macros"] }
# ONNX inference in pure Rust (no native runtime to download), for plugins' models; prost
# is tract's own protobuf crate, for writing small models.
tract-onnx = { version = "0.23", default-features = false }
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "50", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = "50"
# Only for the plugin sandbox's seeded randomness; the same version wasmtime-wasi uses.
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
wit-bindgen = "0.63"
# Reading zipped CSV files (e.g. Binance's monthly archives).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
